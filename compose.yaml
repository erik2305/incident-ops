services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: incidentops_dev
      POSTGRES_PASSWORD: incidentops_dev_only
      POSTGRES_DB: incidentops_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentops_dev -d incidentops_test"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
