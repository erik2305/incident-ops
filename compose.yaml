services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: incidentops_dev
      POSTGRES_PASSWORD: incidentops_dev_only
      POSTGRES_DB: incidentops_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentops_dev -d incidentops_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  inventory:
    build:
      context: ./services
      args:
        SERVICE: inventory
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/__ops/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
  checkout:
    build:
      context: ./services
      args:
        SERVICE: checkout
    environment:
      INVENTORY_BASE_URL: http://inventory:8000
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/__ops/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
