[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentops"
version = "0.1.0"
description = "A LangGraph foundation for incident response."
requires-python = ">=3.11"
dependencies = ["langgraph", "langgraph-checkpoint-postgres", "psycopg[binary]"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
