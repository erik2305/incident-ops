[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentops"
version = "1.0.0"
description = "Durable incident investigation with exact human approval and recovery verification."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint>=4.2.0,<5",
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "psycopg[binary]>=3.3.6,<4",
    "mcp>=2.3.0,<3",
    "httpx>=0.28.1,<1",
    "httpx2>=2.13.1,<3",
    "anyio>=4.15.1,<5",
    "langchain-openrouter>=0.2.9,<0.3",
    "openrouter>=0.11.46,<1",
    "langchain-core>=1.6.6,<2",
    "pydantic>=2.12.5,<3",
    "fastapi>=0.142.2,<1",
    "uvicorn>=0.54.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "ruff>=0.16.10,<1", "python-dotenv>=1.2.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires explicitly configured external test services",
    "live_llm: requires a paid live OpenRouter model call",
]

[tool.ruff]
target-version = "py311"
