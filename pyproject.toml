[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentops"
version = "0.1.0"
description = "A LangGraph foundation for incident response."
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "mcp>=2,<3",
    "httpx",
    "langchain-openrouter>=0.2.8,<0.3",
    "openrouter>=0.9.2,<1",
    "langchain-core",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "python-dotenv>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires explicitly configured external test services"]

[tool.ruff]
target-version = "py311"
